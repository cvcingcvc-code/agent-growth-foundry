name: Basic CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated checks
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_dataset.py
          python scripts/train_lora.py --dry-run
          python scripts/run_demo.py --db /tmp/gf-state.db --report /tmp/gf-intake.json
